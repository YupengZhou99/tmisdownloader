name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  workflow_dispatch:          # 支持手动在 Actions 页面触发

jobs:
  build:
    name: PyInstaller · Windows x64 · Python 3.11
    runs-on: windows-2022

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 Python ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 安装依赖 ────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. 安装 Playwright 驱动（Node.js driver，不含浏览器）──
      # 注意：程序运行时使用系统 Chrome（channel=chrome），
      #       无需打包 Chromium，只需安装 playwright Python 包的 driver。
      - name: Install Playwright driver only
        run: playwright install --with-deps chromium
        continue-on-error: true   # 即使失败也继续，driver 已在 pip 包内

      # ── 5. 构建「国库收支存明细表下载」─────────────────────────
      - name: Build 国库收支存明细表下载.exe
        run: >-
          pyinstaller
          --onefile
          --windowed
          --name "国库收支存明细表下载"
          --collect-all playwright
          --hidden-import asyncio
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.scrolledtext
          "固定收支存明细表下载.py"

      # ── 6. 构建「TMIS数据批量抓取工具V5」────────────────────────
      - name: Build TMIS数据批量抓取工具V5.exe
        run: >-
          pyinstaller
          --onefile
          --windowed
          --name "TMIS数据批量抓取工具V5"
          --collect-all playwright
          --hidden-import asyncio
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.scrolledtext
          "TMIS数据批量抓取工具V5.0_副本.py"

      # ── 7. 列出构建产物（调试用）──────────────────────────────
      - name: List dist directory
        run: dir dist

      # ── 8. 复制模板文件到 dist ────────────────────────────────────
      - name: Copy templates to dist
        shell: pwsh
        run: |
          $files = @(
            "国库列表模板.xlsx",
            "TMIS数据自由查询参数模板_v5.1.xlsx",
            "TMIS网页版new正常期收入支出退库库存参数表_1009000000_v5.1.xlsx",
            "TMIS网页版new正常期收入支出退库库存参数表_1000000000_省级_v5.1.xlsx",
            "README_V5.0_副本.md"
          )
          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item $file dist\
            }
          }

      # ── 9. 上传 EXE + 模板为 Artifact（保留 30 天）──────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TMIS-Windows10-x64-EXE
          path: |
            dist/*.exe
            dist/*.xlsx
            dist/*.md
          retention-days: 30
          if-no-files-found: error
