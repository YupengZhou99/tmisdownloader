name: Quick package TMIS Workbench V6.2 Kylin x64
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/kylin-x64-stock'
    paths:
      - 'desktop/**'
      - 'tmis_*.py'
      - 'TMIS数据批量抓取工具V5.0_副本.py'
      - 'tests/test_report_*.py'
      - 'tests/fixtures/**'
      - 'tests/desktop_fixture_server.py'
      - 'tests/workspace_fixture_server.py'
      - 'scripts/build-desktop-kylin.sh'
      - 'scripts/launch-desktop-linux.sh'
      - 'scripts/debian-bullseye-snapshot.list'
      - 'requirements-linux-x64.txt'
      - 'DESKTOP_V6.md'
      - '.github/workflows/build-desktop-kylin.yml'
permissions:
  contents: read
concurrency:
  group: tmis-desktop-kylin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package only on glibc 2.31 (tests skipped by request)
        run: >-
          docker run --rm --platform linux/amd64 --shm-size=256m
          -e BUILD_COMMIT="${{ github.sha }}"
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          python:3.11-bullseye@sha256:df0bd610af061603b29d63eb82027b64d5a3f15506e39270422b10b2a55079fc
          bash scripts/build-desktop-kylin.sh
      - name: Upload V6 Linux desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: TMIS-Workbench-V6.2-Kylin-x64
          path: |
            dist/TMIS-Workbench-V6.2-Kylin-x64.tar.gz
            dist/TMIS-Workbench-V6.2-Kylin-x64.tar.gz.sha256
            dist/使用说明.md
            dist/打包状态.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
